<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FREE-ISH Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #04071A;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ─── TOP: Full image ─── */
    #image-section {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1140px;
    }
    #image-section img {
      width: 100%;
      height: 1080px;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    /* Gradient fade: image color → deep complementary blue */
    #image-section::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      bottom: 0;
      height: 360px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(4,7,26,0.5) 40%,
        rgba(4,7,26,0.88) 70%,
        #04071A 100%
      );
    }

    /* ─── BOTTOM: Info section ─── */
    #info-section {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      top: 1080px;
      background: #04071A;
      padding: 60px 80px 80px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Presenter */
    #presenter {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #C8FF00;
      margin-bottom: 16px;
    }

    /* FREE-ISH */
    #title {
      font-family: 'Playfair Display', serif;
      font-size: 220px;
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -0.03em;
      color: #FFFFFF;
      margin-bottom: 20px;
    }

    /* Subtitle */
    #subtitle {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-style: italic;
      color: rgba(255,255,255,0.55);
      margin-bottom: 44px;
    }

    /* Divider */
    #divider {
      height: 1px;
      background: linear-gradient(to right, #C8FF00, rgba(200,255,0,0.15), transparent);
      margin-bottom: 40px;
    }

    /* Date row */
    #dateline {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 44px;
    }
    #dates {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #FFFFFF;
    }
    .sep { color: #C8FF00; font-size: 20px; }
    #location {
      font-size: 32px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
    }

    /* Talent */
    #talent {
      display: flex;
      gap: 0;
      margin-bottom: 52px;
    }
    .t {
      flex: 1;
      padding: 0 32px 0 0;
      margin-right: 32px;
      border-right: 1px solid rgba(200,255,0,0.2);
    }
    .t:last-child { border-right: none; margin-right: 0; padding-right: 0; }
    .t-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #C8FF00;
      margin-bottom: 6px;
    }
    .t-name {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1;
    }
    .t-note {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      margin-top: 4px;
      letter-spacing: 0.1em;
    }

    /* Bottom row */
    #bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }
    #rsvp-url {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    #rsvp-btn {
      display: block;
      padding: 20px 60px;
      background: #C8FF00;
      color: #04071A;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- IMAGE SECTION — untouched at top -->
  <div id="image-section">
    <img src="umma-mural-final.jpg" alt="FREE-ISH Juneteenth 2026 — Art by ARRRTADDICT">
  </div>

  <!-- INFO SECTION — below image -->
  <div id="info-section">

    <div id="presenter">In &amp; Out Podcast Presents</div>

    <div id="title">FREE&#8209;ISH</div>

    <div id="subtitle">Juneteenth Weekend Freedom Celebration</div>

    <div id="divider"></div>

    <div id="dateline">
      <div id="dates">June 19 – 21, 2026</div>
      <div class="sep">✦</div>
      <div id="location">Atlanta, GA</div>
    </div>

    <div id="talent">
      <div class="t">
        <div class="t-role">Hosted By</div>
        <div class="t-name">T'Challa</div>
      </div>
      <div class="t">
        <div class="t-role">Hosted By</div>
        <div class="t-name">Dun Deal</div>
        <div class="t-note">On The Track</div>
      </div>
      <div class="t">
        <div class="t-role">Main DJ</div>
        <div class="t-name">Dell Harris</div>
      </div>
      <div class="t">
        <div class="t-role">Guest Set</div>
        <div class="t-name">DJ Ray G</div>
        <div class="t-note">Cardi B's DJ</div>
      </div>
    </div>

    <div id="bottom-row">
      <div id="rsvp-url">events.innoutww.com</div>
      <a id="rsvp-btn" href="https://events.innoutww.com/#rsvp">Secure Your Spot</a>
    </div>

  </div>

</body>
</html>
